<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות לספרינט Live - B-MRI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandDark: '#1A1A1A',
                        brandBlue: '#3A5268',
                        brandRed: '#E63946',
                        brandGreen: '#A8D92E',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #1A1A1A;
            color: #F8FAFC;
        }
    </style>
</head>
<body class="font-sans flex flex-col justify-center items-center min-h-screen px-4">
    <div class="max-w-md w-full bg-black/30 border border-brandBlue/30 p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-white">כניסה למערכת הצבעה</h1>
            <p class="text-slate-400 mt-1 text-sm">הזן את פרטיך כדי להתחבר ישירות למצגת הספרינט של B-MRI</p>
        </div>

        <form action="/live/vote" method="GET" class="flex flex-col gap-4">
            <div>
                <label class="block text-slate-300 text-xs mb-1">שם מלא</label>
                <input type="text" name="name" required placeholder="ישראל ישראלי" class="w-full bg-brandDark border border-brandBlue/30 rounded px-3 py-2 text-white focus:outline-none focus:border-brandRed">
            </div>
            <div>
                <label class="block text-slate-300 text-xs mb-1">תפקיד / פונקציה בארגון</label>
                <select name="role" class="w-full bg-brandDark border border-brandBlue/30 rounded px-3 py-2 text-white focus:outline-none">
                    <option value="הנהלה">מנכ"ל / הנהלה בכירה</option>
                    <option value="שיווק">מנהל שיווק</option>
                    <option value="מכירות">מנהל מכירות</option>
                    <option value="תפעול">מנהל תפעול</option>
                    <option value="כספים">מנהל כספים</option>
                    <option value="משאבי אנוש">משאבי אנוש</option>
                </select>
            </div>
            <button type="submit" class="bg-brandRed hover:bg-brandRed/90 text-white font-semibold py-2.5 rounded transition mt-2">התחבר וסנכרן שלט 📱</button>
        </form>
    </div>
</body>
</html>
